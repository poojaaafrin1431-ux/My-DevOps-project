name: Auto Deploy

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stop old container
        run: docker stop smart-calorie-wellness || true

      - name: Remove old container
        run: docker rm smart-calorie-wellness || true

      - name: Remove old image
        run: docker rmi my-devops-project_wellness-app || true

      - name: Build Docker Image
        run: docker build -t my-devops-project_wellness-app .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name smart-calorie-wellness \
            -p 3000:3000 \
            my-devops-project_wellness-app