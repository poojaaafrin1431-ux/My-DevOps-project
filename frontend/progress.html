<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Progress - Smart Calorie Tracking and Wellness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <h1>Smart Calorie Tracking &amp; Wellness</h1>
    <nav>
      <a href="index.html">Home / BMI</a>
      <a href="tracker.html">Food Tracker</a>
      <a href="progress.html" class="active">Progress</a>
      <a href="skin.html">Skin Type</a>
      <a href="exercise.html">Exercise</a>
    </nav>
    <div class="topbar-user">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">

    <section class="card">
      <h2>Log Your Weight</h2>
      <form id="weightForm">
        <label>Date
          <input type="date" id="entryDate" required>
        </label>
        <label>Weight (kg)
          <input type="number" id="entryWeight" step="0.1" min="20" max="250" required>
        </label>
        <button type="submit">Add Entry</button>
      </form>
    </section>

    <section class="card">
      <h2>Weight Progress Graph</h2>
      <canvas id="weightChart" width="800" height="320"></canvas>
      <p class="chart-legend">
        <span class="legend-dot blue"></span> Your Weight
        <span class="legend-dot green"></span> Target Weight
      </p>
    </section>

    <section class="card" id="alertSection" style="display:none;">
      <h2>Weight Loss Rate Check</h2>
      <div id="alertBox" class="alert"></div>
    </section>

    <section class="card">
      <h2>Entry History</h2>
      <table class="overview-table" id="historyTable">
        <thead>
          <tr><th>Date</th><th>Weight (kg)</th><th></th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </section>

  </main>

  <script src="js/auth-guard.js"></script>
  <script src="js/progress.js"></script>
</body>
</html>
