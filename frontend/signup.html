<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Smart Calorie Tracking & Wellness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-panel">
      <div class="auth-brand">
        <svg viewBox="0 0 100 100" class="brand-icon" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,0.15)"/>
          <path d="M50 78c-14-9-26-19-26-33 0-10 8-17 17-17 5 0 9 2 9 6 0-4 4-6 9-6 9 0 17 7 17 17 0 14-12 24-26 33z" fill="#ffffff"/>
          <path d="M50 40v22M40 51h20" stroke="#2e7d5b" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h2>Smart Calorie Tracking &amp; Wellness</h2>
        <p>Create your free account and start building healthier daily habits.</p>
        <ul class="auth-highlights">
          <li>✔ Personalised calorie &amp; protein targets</li>
          <li>✔ Skin type tips just for you</li>
          <li>✔ Exercise plans by body area</li>
        </ul>
      </div>

      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtext">Sign up to get started</p>

        <div id="errorBox" class="alert red" style="display:none;"></div>

        <form id="signupForm" class="auth-form">
          <label>Full Name
            <input type="text" id="name" placeholder="Enter your full name" required>
          </label>
          <label>Email
            <input type="email" id="email" placeholder="Enter your email" required>
          </label>
          <label>Password
            <input type="password" id="password" placeholder="Create a password" required>
          </label>
          <label>Confirm Password
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
          </label>
          <button type="submit">Sign Up</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
