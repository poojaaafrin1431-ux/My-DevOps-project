<h1>Welcome</h1>
<h1>Auto Deploy Test</h1>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calorie Tracking and Wellness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <h1>Smart Calorie Tracking &amp; Wellness</h1>
    <nav>
      <a href="index.html" class="active">Home / BMI</a>
      <a href="tracker.html">Food Tracker</a>
      <a href="progress.html">Progress</a>
      <a href="skin.html">Skin Type</a>
      <a href="exercise.html">Exercise</a>
    </nav>
    <div class="topbar-user">
      <span id="welcomeText"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Step 1: Your Profile</h2>
      <form id="profileForm">
        <label>Age (years)
          <input type="number" id="age" required min="10" max="100">
        </label>
        <label>Gender
          <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </label>
        <label>Height (cm)
          <input type="number" id="height" required min="100" max="250">
        </label>
        <label>Weight (kg)
          <input type="number" id="weight" required min="20" max="250">
        </label>
        <label>Activity Level
          <select id="activity">
            <option value="1.2">Sedentary (little/no exercise)</option>
            <option value="1.375">Lightly active (1-3 days/week)</option>
            <option value="1.55">Moderately active (3-5 days/week)</option>
            <option value="1.725">Very active (6-7 days/week)</option>
            <option value="1.9">Extra active (athlete)</option>
          </select>
        </label>
        <label>Target Weight (kg)
          <input type="number" id="targetWeight" required min="20" max="250">
        </label>
        <button type="submit">Calculate</button>
      </form>
    </section>

    <section class="card" id="resultCard" style="display:none;">
      <h2>Your Results</h2>

      <div class="result-grid">
        <div class="result-box" id="bmiBox">
          <span class="label">BMI</span>
          <span class="value" id="bmiValue">--</span>
          <span class="tag" id="bmiCategory">--</span>
        </div>
        <div class="result-box">
          <span class="label">BMR</span>
          <span class="value" id="bmrValue">--</span>
          <span class="tag">kcal/day (base)</span>
        </div>
        <div class="result-box">
          <span class="label">TDEE</span>
          <span class="value" id="tdeeValue">--</span>
          <span class="tag">kcal/day (maintain)</span>
        </div>
        <div class="result-box">
          <span class="label">To Lose Weight</span>
          <span class="value" id="loseValue">--</span>
          <span class="tag">kcal/day (safe deficit)</span>
        </div>
      </div>

      <div id="alertBox" class="alert" style="display:none;"></div>

      <p id="etaText"></p>
    </section>
  </main>

  <script src="js/auth-guard.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
